name: Release

# OPTIONAL. Installing from the repository's source archive works without this,
# because packs/ is committed. Adopt this workflow only if you would rather
# distribute versioned releases; if you do, change the manifest and download
# URLs in system.json to:
#
#   manifest: https://github.com/<owner>/fading-suns/releases/latest/download/system.json
#   download: https://github.com/<owner>/fading-suns/releases/download/v<version>/fading-suns.zip
#
# (the workflow rewrites the download URL itself, but the manifest URL has to be
# committed pointing at releases/latest, or Foundry will keep checking the branch).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches system.json
        run: |
          MANIFEST=$(node -p "require('./system.json').version")
          if [ "$MANIFEST" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.version }} does not match system.json version $MANIFEST"
            exit 1
          fi

      - name: Build, validate and test
        run: npm run build

      - name: Point the download URL at this release
        run: |
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const repo = process.env.GITHUB_REPOSITORY;
            const system = JSON.parse(fs.readFileSync("system.json", "utf8"));
            system.download = `https://github.com/${repo}/releases/download/v${version}/fading-suns.zip`;
            fs.writeFileSync("system.json", JSON.stringify(system, null, 2) + "\n");
          ' "${{ steps.version.outputs.version }}"

      - name: Assemble the archive
        run: |
          zip -r fading-suns.zip \
            system.json README.md \
            module/ templates/ styles/ lang/ packs/ \
            --exclude '*.DS_Store'
          unzip -l fading-suns.zip | grep -q 'packs/learned-skills/.*\.ldb' \
            || { echo "::error::Archive contains no compiled packs"; exit 1; }

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          files: |
            fading-suns.zip
            system.json
          generate_release_notes: true
