name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build packs
        run: npm run build:packs
      - name: Validate manifest, templates and localisation
        run: npm run validate
      - name: Rules engine tests
        run: npm test
